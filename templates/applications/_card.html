<div id="application-{{ application.pk }}" class="card mb-2 p-2"><a href="{% url 'applications:detail' application.pk %}">{{ application.job_position.company }}<br><strong>{{ application.job_position.title }}</strong></a><form hx-post="{% url 'applications:status' application.pk %}" hx-target="#application-{{ application.pk }}" hx-swap="outerHTML"><select name="status" class="form-select form-select-sm mt-2" onchange="this.form.requestSubmit()">{% for value,label in application.Status.choices %}<option value="{{ value }}" {% if value == application.status %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></form></div>
