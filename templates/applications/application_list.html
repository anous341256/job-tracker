{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><div><span class="eyebrow">APPLICATIONS</span><h1>投递</h1></div><a class="btn btn-primary align-self-center" href="{% url 'applications:create' %}">新建投递</a></div><form class="row g-2 my-3"><div class="col-lg-3"><input class="form-control" name="q" value="{{ request.GET.q }}" placeholder="搜索公司或职位"></div><div class="col"><select class="form-select" name="company"><option value="">全部公司</option>{% for x in companies %}<option value="{{ x.pk }}" {% if request.GET.company == x.pk|stringformat:'s' %}selected{% endif %}>{{ x.name }}</option>{% endfor %}</select></div><div class="col"><select class="form-select" name="status"><option value="">全部状态</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="col"><select class="form-select" name="source"><option value="">全部来源</option>{% for value,label in sources %}<option value="{{ value }}" {% if request.GET.source == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="col"><input type="date" class="form-control" name="date_from" value="{{ request.GET.date_from }}"></div><div class="col"><input type="date" class="form-control" name="date_to" value="{{ request.GET.date_to }}"></div><div class="col-auto"><button class="btn btn-outline-primary">筛选</button></div></form><div class="list-group">{% for x in object_list %}<a class="list-group-item list-group-item-action" href="{% url 'applications:detail' x.pk %}">{{ x.job_position.company }} · <strong>{{ x.job_position.title }}</strong><span class="float-end badge text-bg-primary">{{ x.get_status_display }}</span></a>{% empty %}<p class="empty-state">暂无投递，先创建第一条投递记录吧。</p>{% endfor %}</div>{% include 'generic/pagination.html' %}{% endblock %}
