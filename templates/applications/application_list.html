{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>投递</h1><a class="btn btn-primary" href="{% url 'applications:create' %}">新建投递</a></div><form class="my-3"><input class="form-control" name="q" value="{{ request.GET.q }}" placeholder="搜索公司或职位"></form><div class="list-group">{% for x in object_list %}<a class="list-group-item" href="{% url 'applications:detail' x.pk %}">{{ x.job_position.company }} · <strong>{{ x.job_position.title }}</strong><span class="float-end badge text-bg-primary">{{ x.get_status_display }}</span></a>{% empty %}<p>暂无投递</p>{% endfor %}</div>{% include 'generic/pagination.html' %}{% endblock %}
