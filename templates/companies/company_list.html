{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><div><span class="eyebrow">COMPANIES</span><h1>公司</h1></div><a class="btn btn-primary align-self-center" href="{% url 'companies:create' %}">添加公司</a></div><form class="row g-2 my-3"><div class="col-lg-4"><input class="form-control" name="q" value="{{ request.GET.q }}" placeholder="搜索公司、行业或地点"></div><div class="col"><select class="form-select" name="status"><option value="">全部状态</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="col"><select class="form-select" name="priority"><option value="">全部优先级</option>{% for value,label in priorities %}<option value="{{ value }}" {% if request.GET.priority == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="col"><select class="form-select" name="industry"><option value="">全部行业</option>{% for value in industries %}<option value="{{ value }}" {% if request.GET.industry == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div><div class="col-auto"><button class="btn btn-outline-primary">筛选</button></div></form><div class="list-group">{% for x in object_list %}<a class="list-group-item list-group-item-action" href="{% url 'companies:detail' x.pk %}"><strong>{{ x.name }}</strong> <span class="badge text-bg-secondary">{{ x.get_status_display }}</span><span class="float-end">{{ x.job_count }} 个职位</span></a>{% empty %}<p class="empty-state">还没有公司，先添加第一家公司吧。</p>{% endfor %}</div>{% include 'generic/pagination.html' %}{% endblock %}
