{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>公司</h1><a class="btn btn-primary" href="{% url 'companies:create' %}">添加公司</a></div><form class="row g-2 my-3"><div class="col"><input class="form-control" name="q" value="{{ request.GET.q }}" placeholder="搜索"></div><div class="col-auto"><button class="btn btn-outline-primary">筛选</button></div></form><div class="list-group">{% for x in object_list %}<a class="list-group-item list-group-item-action" href="{% url 'companies:detail' x.pk %}"><strong>{{ x.name }}</strong> <span class="badge text-bg-secondary">{{ x.get_status_display }}</span><span class="float-end">{{ x.job_count }} 个职位</span></a>{% empty %}<p>还没有公司。</p>{% endfor %}</div>{% include 'generic/pagination.html' %}{% endblock %}
