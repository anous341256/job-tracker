{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><div><span class="eyebrow">POSITIONS</span><h1>职位</h1></div><a class="btn btn-primary align-self-center" href="{% url 'companies:job-create' %}">添加职位</a></div><form class="row g-2 my-3"><div class="col-lg-3"><input class="form-control" name="q" value="{{ request.GET.q }}" placeholder="搜索职位或公司"></div><div class="col"><select class="form-select" name="company"><option value="">全部公司</option>{% for x in companies %}<option value="{{ x.pk }}" {% if request.GET.company == x.pk|stringformat:'s' %}selected{% endif %}>{{ x.name }}</option>{% endfor %}</select></div><div class="col"><select class="form-select" name="status"><option value="">全部状态</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="col"><select class="form-select" name="work_mode"><option value="">全部办公方式</option>{% for value,label in work_modes %}<option value="{{ value }}" {% if request.GET.work_mode == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="col"><select class="form-select" name="deadline"><option value="">全部截止日期</option><option value="upcoming" {% if request.GET.deadline == 'upcoming' %}selected{% endif %}>即将截止</option><option value="overdue" {% if request.GET.deadline == 'overdue' %}selected{% endif %}>已过期</option><option value="none" {% if request.GET.deadline == 'none' %}selected{% endif %}>未填写</option></select></div><div class="col-auto"><button class="btn btn-outline-primary">筛选</button></div></form><div class="list-group">{% for x in object_list %}<a class="list-group-item list-group-item-action" href="{% url 'companies:job-detail' x.pk %}"><strong>{{ x.title }}</strong> · {{ x.company }} <span class="float-end">{{ x.application_deadline|default:'无截止日期' }}</span></a>{% empty %}<p class="empty-state">暂无职位，先从公司页面添加一个职位吧。</p>{% endfor %}</div>{% include 'generic/pagination.html' %}{% endblock %}
