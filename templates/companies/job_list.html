{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>职位</h1><a class="btn btn-primary" href="{% url 'companies:job-create' %}">添加职位</a></div><form class="my-3"><input class="form-control" name="q" value="{{ request.GET.q }}" placeholder="搜索职位或公司"></form><div class="list-group">{% for x in object_list %}<a class="list-group-item" href="{% url 'companies:job-detail' x.pk %}"><strong>{{ x.title }}</strong> · {{ x.company }} <span class="float-end">{{ x.application_deadline|default:'无截止日期' }}</span></a>{% empty %}<p>暂无职位</p>{% endfor %}</div>{% include 'generic/pagination.html' %}{% endblock %}
