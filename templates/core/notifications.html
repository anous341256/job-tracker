{% extends 'base.html' %}{% block content %}<h1>通知</h1>{% for x in notifications %}<div class="card mb-2 p-3 {% if not x.is_read %}border-primary{% endif %}"><strong>{{ x.title }}</strong><p>{{ x.message }}</p>{% if not x.is_read %}<form method="post" action="{% url 'core:notification-read' x.pk %}">{% csrf_token %}<button class="btn btn-sm btn-outline-primary">标记已读</button></form>{% endif %}</div>{% empty %}<p>暂无通知</p>{% endfor %}{% endblock %}
