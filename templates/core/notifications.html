{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h1>通知</h1><form method="post" action="{% url 'core:notifications-read-all' %}">{% csrf_token %}<button class="btn btn-outline-primary">全部标为已读</button></form></div>
{% for x in notifications %}<div class="card mb-2 p-3 {% if not x.is_read %}border-primary{% endif %}"><div class="d-flex justify-content-between"><strong>{{ x.title }}</strong><span class="small text-muted">{{ x.created_at }}</span></div><p class="mb-2">{{ x.message }}</p><div>{% if x.url %}<a href="{{ x.url }}">查看相关内容</a>{% endif %}{% if not x.is_read %}<form class="d-inline ms-2" method="post" action="{% url 'core:notification-read' x.pk %}">{% csrf_token %}<button class="btn btn-sm btn-outline-primary">标记已读</button></form>{% endif %}</div></div>{% empty %}<p class="empty-state">暂无通知。</p>{% endfor %}
{% endblock %}
