{% if is_paginated %}
<nav class="mt-3" aria-label="分页"><ul class="pagination justify-content-center">
  {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="{% querystring page=page_obj.previous_page_number %}">上一页</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">第 {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 页</span></li>
  {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="{% querystring page=page_obj.next_page_number %}">下一页</a></li>{% endif %}
</ul></nav>
{% endif %}
