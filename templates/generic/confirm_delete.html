{% extends 'base.html' %}{% block content %}<div class="card mx-auto" style="max-width:680px"><div class="card-body p-4"><h1 class="h3">删除{{ kind }}</h1><p>确定删除“<strong>{{ object }}</strong>”吗？</p><div class="alert alert-warning">有关联业务数据时系统会阻止删除，并提示改用归档。</div><form method="post">{% csrf_token %}<button class="btn btn-danger">确认删除</button> <a class="btn btn-outline-secondary" href="{{ cancel_url }}">取消</a></form></div></div>{% endblock %}
