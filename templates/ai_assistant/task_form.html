{% extends 'base.html' %}{% block content %}<div class="content-panel mx-auto" style="max-width:900px"><span class="eyebrow">{{ job.company }}</span><h1>{{ title }}</h1><h2 class="h5 mb-4">{{ job.title }}</h2><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="mb-3">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>{% endfor %}<div class="alert alert-light">AI 输出仅供参考，不会自动修改职位、投递或简历。</div><button class="btn btn-primary">创建分析任务</button> <a class="btn btn-outline-secondary" href="{% url 'companies:job-detail' job.pk %}">取消</a></form></div>{% endblock %}
