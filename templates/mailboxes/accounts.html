{% extends 'base.html' %}{% block content %}<h1>邮箱账户</h1><a class="btn btn-outline-danger" href="{% url 'mailboxes:connect' 'gmail' %}">连接 Gmail</a> <a class="btn btn-outline-primary" href="{% url 'mailboxes:connect' 'outlook' %}">连接 Outlook</a><hr>{% for x in accounts %}<div class="card p-3 mb-2"><strong>{{ x.email_address }}</strong> · {{ x.get_provider_display }} · {{ x.get_status_display }}<div class="mt-2"><form class="d-inline" method="post" action="{% url 'mailboxes:sync' x.pk %}">{% csrf_token %}<button class="btn btn-sm btn-primary">同步</button></form> <form class="d-inline" method="post" action="{% url 'mailboxes:disconnect' x.pk %}">{% csrf_token %}<button class="btn btn-sm btn-outline-danger">断开</button></form></div></div>{% empty %}<p>尚未连接邮箱。配置 OAuth 凭据后即可授权。</p>{% endfor %}{% endblock %}
