{% extends 'base.html' %}{% block content %}<h1>同步邮件</h1>{% for x in emails %}<div class="card p-3 mb-2"><strong>{{ x.subject }}</strong><div>{{ x.sender }} · {{ x.received_at }}</div><p>{{ x.body_text|truncatechars:250 }}</p><div>{% if x.company %}<span class="badge text-bg-secondary">{{ x.company }}</span>{% endif %} <a href="{% url 'mailboxes:link-message' x.pk %}">关联业务数据</a></div></div>{% empty %}<p>暂无同步邮件。</p>{% endfor %}{% endblock %}
